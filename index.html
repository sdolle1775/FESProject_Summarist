<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#032b41" />
    <meta name="description" content="Summarist - key ideas from the world's best books." />
    <title>Summarist</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function restoreGitHubPagesRoute() {
        var redirect = sessionStorage.getItem("summarist:redirect");
        if (redirect) {
          sessionStorage.removeItem("summarist:redirect");
          var target = new URL(redirect);
          history.replaceState(null, "", target.pathname + target.search + target.hash);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
